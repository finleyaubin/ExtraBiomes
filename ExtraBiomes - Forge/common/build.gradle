architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Fabric loader is only needed on the common compile classpath for @Environment annotations
    // and mixin dependencies. No fabric module exists yet in this project — keep this even so,
    // it costs nothing and saves a step when a fabric module is added later.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // TerraBlender's API package (terrablender.api.*) is identical across its forge/fabric
    // artifacts, so common code against it compiles fine without a platform choice here.
    modCompileOnly "com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}"

    // GeckoLib is used directly by a couple of common classes for this Forge-only pass
    // (FrogHelmetItem/FrogHelmetRenderer) — a real cross-loader abstraction is deferred
    // until a second loader is added.
    modCompileOnly "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"

    // architectury { common("forge") } only controls output transforms for packaging, NOT
    // compile-time access to Forge's own API — that has to be added explicitly. A handful of
    // common classes (Config/ModFluids/ModFluidTypes/ModItems/ModLogs/ModLeavesWithSupport/
    // FrogHelmetItem/BaseFluidType) use Forge-only types (ForgeConfigSpec, FluidType,
    // ForgeSpawnEggItem, IForgeShearable, ToolAction, IClientItemExtensions/
    // IClientFluidTypeExtensions) with no vanilla/cross-loader equivalent yet — accepted
    // Forge-shaped exceptions for this Forge-only pass. The "universal" classifier exposes
    // Forge's own authored classes (not SRG-obfuscated, unlike vanilla Minecraft symbols in
    // this jar) so it's safe to reference at compile time without Loom's remapping.
    compileOnly "net.minecraftforge:forge:${minecraft_version}-${forge_version}:universal"
    // javax.annotation.Nullable (JSR-305) — pulled in transitively via ForgeGradle previously,
    // not automatically present under Loom.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
