name: Build Mod

on:
  push:
    branches-ignore:
      - '**bedrock**'
      - '**Bedrock**'
    paths-ignore:
      - '.github/workflows/**'
      - 'Changelogs/**'
      - '**.md'
  pull_request:
    branches-ignore:
      - '**bedrock**'
      - '**Bedrock**'
    paths-ignore:
      - '.github/workflows/**'
      - 'Changelogs/**'
      - '**.md'

permissions:
  contents: read

# Stages: setup -> datagen -> test (parallel suites) beside package -> build (the required check).
# Datagen output travels between jobs as an artifact.
jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ExtraBiomes - Java"
    timeout-minutes: 5
    outputs:
      forge: ${{ steps.platforms.outputs.forge }}
      fabric: ${{ steps.platforms.outputs.fabric }}
      neoforge: ${{ steps.platforms.outputs.neoforge }}
      suites: ${{ steps.suites.outputs.list }}
    steps:
      - uses: actions/checkout@v7


      # Single source of truth for which loaders this branch ships (gradle.properties'
      # enabled_platforms, read by common/build.gradle's `architectury { common(...) }` call too)
      # - every loader-specific step below is gated on this instead of the workflow hardcoding
      # which loaders exist, so a version bump that drops/adds a loader only needs to change
      # enabled_platforms, not this file.
      - name: Detect enabled platforms
        id: platforms
        run: |
          PLATFORMS=",$(grep '^enabled_platforms=' gradle.properties | cut -d'=' -f2),"
          for p in forge fabric neoforge; do
            if [[ "$PLATFORMS" == *",$p,"* ]]; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: List test suites
        id: suites
        run: echo "list=$(grep '^enabled_platforms=' gradle.properties | cut -d'=' -f2 | tr ',' '\n' | jq -R . | jq -sc '["unit"] + .')" >> "$GITHUB_OUTPUT"

  datagen:
    needs: setup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ExtraBiomes - Java"
    timeout-minutes: 20
    steps:
      - &checkout
        uses: actions/checkout@v7


      # Loom's toolchain compiles for 17, but the Gradle daemon itself needs 21 to run
      # (a loom dependency requires JVM runtime 21+). Installing both lets Gradle's toolchain
      # support auto-detect the 17 JDK for compilation while running on 21.
      - &jdk
        name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The default only saves from the default branch (main), which rarely builds, so each job here
          # started cold and re-downloaded Loom's Minecraft assets.
          cache-read-only: false

      - &gradlew
        name: Prepare Gradle
        # The build cache lets later jobs reuse classes datagen already compiled.
        run: |
          chmod +x gradlew
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      # Loom keeps each project's mapped Minecraft jars here, outside the Gradle home setup-gradle saves.
      - &loomcache
        name: Cache Loom project files
        uses: actions/cache@v6
        with:
          path: "ExtraBiomes - Java/.gradle/loom-cache"
          key: loom-cache-${{ runner.os }}-${{ hashFiles('ExtraBiomes - Java/**/*.gradle', 'ExtraBiomes - Java/gradle.properties') }}


      # Architectury Loom's shared asset cache (~/.gradle/caches/fabric-loom/assets) isn't
      # populated until this runs at least once. Without it, runData's forked JVM throws
      # "Cannot parse argument '.../fabric-loom/assets' of option assetsDir" and - since Loom's
      # dev-launch wrapper never calls System.exit() after an early crash like this - just hangs
      # forever instead of failing, eating the whole job's time budget (see the 2026-08-19 CI run
      # that hit the 6-hour ceiling on this exact step for the failure mode this step prevents).
      - name: Download Loom assets
        run: ./gradlew :forge:downloadAssets
        timeout-minutes: 10


      # :forge:runData now uses its own "run-data" directory (see forge/build.gradle's data
      # run config) instead of the "run" dir shared with runGameTestServer - it was previously
      # leaving a throwaway world save (forge/run/world/level.dat) behind as a side effect of
      # bootstrapping structure/registry context, which silently overrode the level-seed pinned
      # in the EULA step above (Minecraft only reads level-seed when *creating* a world) by the
      # time runGameTestServer started. That was the actual cause of CI's "17/26 biomes not
      # found" runs - the pinned seed was never taking effect, not a biome-placement/TerraBlender
      # issue. Isolating runData's working directory removes the interference at its source.
      - name: Generate data
        run: ./gradlew :forge:runData
        timeout-minutes: 10


      # Loom's data() run type is Forge-only, so Fabric API's own
      # fabricApi.configureDataGeneration() extension provides the equivalent "runDatagen" task
      # instead (see fabric/build.gradle). Forge's own runData above already populates most of
      # the same shared common/src/generated/resources/, but NOT everything - Fabric's own
      # ModBiomeTagProvider is the only one that writes Fabric's convention tags (c:mushroom,
      # c:swamp, ...; Forge/NeoForge write their own forge:/neoforge: equivalents instead), so
      # this always runs whenever Fabric is enabled, not just when it's the sole loader -
      # skipping it silently shipped Fabric builds without those tags populated at all. Placed
      # immediately before Fabric's own block below since Fabric's GameTestServer boot needs
      # this data present too, same as :common:test does.
      # mergeGeneratedData runs runDatagen into a private dir, then merges it into the shared folder
      # without wiping Forge/NeoForge-only data (#135).
      - name: Generate Fabric data
        if: needs.setup.outputs.fabric == 'true'
        run: ./gradlew :fabric:mergeGeneratedData
        timeout-minutes: 10


      - name: Download NeoForge Loom assets
        run: ./gradlew :neoforge:downloadAssets
        timeout-minutes: 10


      # Same private-dir + merge as Fabric's step above, preserving Fabric's data/c tags and Forge's biome modifiers (#135).
      - name: Generate NeoForge data
        run: ./gradlew :neoforge:mergeGeneratedData
        timeout-minutes: 10

      - name: Verify shared generated data exists
        run: |
          if [ ! -d common/src/generated/resources/data/extrabiomes ] || \
             [ -z "$(ls -A common/src/generated/resources/data/extrabiomes 2>/dev/null)" ]; then
            echo "::error::common/src/generated/resources/data/extrabiomes is missing or empty - no enabled loader generated shared data."
            exit 1
          fi

      - name: Upload generated data
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-generated-resources
          path: "ExtraBiomes - Java/common/src/generated/resources"
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [setup, datagen]
    name: test (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.setup.outputs.suites) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ExtraBiomes - Java"
    # Forge's one-boot-per-test GameTests alone can take ~40 minutes on branches that ship Forge.
    timeout-minutes: 60
    steps:
      - *checkout
      - *jdk
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          # Only jobs that launch Minecraft need Loom's assets; leaving them out shrinks this job's cache restore.
          gradle-home-cache-excludes: ${{ matrix.suite == 'unit' && 'caches/fabric-loom/assets' || '' }}
      - *gradlew
      - *loomcache
      - name: Download generated data
        uses: actions/download-artifact@v8
        with:
          name: extrabiomes-generated-resources
          path: "ExtraBiomes - Java/common/src/generated/resources"


      # runGameTestServer boots a real dedicated server, which refuses to start without this.
      # Also pre-seed server.properties with a raised max-tick-time:
      # BiomeGenerationGameTests runs each of its 26 mod-biome ServerLevel#findClosestBiome3d
      # searches (15000-block radius, real Perlin noise, no shortcuts) as its own
      # GameTestSequence step on its own server tick, specifically so no single tick has to
      # absorb more than one biome's worst case - a biome that's genuinely absent (or outside the
      # search box) makes findClosestBiome3d walk the *entire* radius with no early exit. Most
      # biomes' full sweep costs 30-40s on a shared CI runner, but biomes constrained to
      # ParameterUtils.Depth.FLOOR (e.g. Deep Dark Green - see ModOverworldRegion.java) force the
      # 3D grid walk to sample near the bottom of the world at every horizontal step instead of
      # short-circuiting near the surface, which is measurably more expensive per sample and has
      # been observed pushing a single tick's search well past 120s (confirmed via a captured
      # crash report + full stack trace rooted in ImprovedNoise.noise/PerlinNoise.getValue - real
      # single-threaded noise computation, not a stuck/looping thread). 1000000ms (1000s) gives a
      # single such sweep generous headroom above that observed worst case while still letting the
      # watchdog catch a genuinely hung tick eventually, instead of disabling it outright - unlike
      # before this test was split per-tick, a bounded value is safe again here since it only ever
      # has to cover one biome's sweep, not the sum of all 26.
      # Also pin level-seed: CI checks out a clean workspace every run, so with no seed set
      # Minecraft generates a brand-new random world each time, and TerraBlender's noise-based
      # biome placement can push most mod biomes outside the fixed 15000-block search box on an
      # unlucky seed (observed: 17/26 biomes "missing" on one CI run vs 1/26 locally, where the
      # persisted run/world/ dir happened to keep reusing the same lucky seed across runs). A
      # fixed seed makes the test's result deterministic across both environments; kept even
      # after narrowing the Jungle Pillars/Fungle Jungle climate-box overlap (see
      # ModOverworldRegion.java) since determinism across CI runs is worth it regardless. Even
      # with a fixed seed, a handful of biomes (e.g. the Cold Mesa family, Deep Dark
      # Forest/Green) still land outside 15000 blocks on this particular seed - that is TerraBlender
      # correctly applying each Region's configured weight (Config.biomeWeight/rareBiomeWeight,
      # wired up via ModTerrablender.registerBiomes(), called from both ForgeConfig.load() and
      # FabricConfig.load()) to a real, non-degenerate climate parameter box per biome; it is not a
      # registration/weight bug, just genuine placement rarity at this specific seed.
      - name: Accept Minecraft EULA for the local test server
        if: matrix.suite == 'forge'
        run: |
          mkdir -p forge/run
          echo "eula=true" > forge/run/eula.txt
          printf 'max-tick-time=1000000\nlevel-seed=extrabiomes\n' > forge/run/server.properties


      # Architectury Loom's shared asset cache (~/.gradle/caches/fabric-loom/assets) isn't
      # populated until this runs at least once. Without it, runData's forked JVM throws
      # "Cannot parse argument '.../fabric-loom/assets' of option assetsDir" and - since Loom's
      # dev-launch wrapper never calls System.exit() after an early crash like this - just hangs
      # forever instead of failing, eating the whole job's time budget (see the 2026-08-19 CI run
      # that hit the 6-hour ceiling on this exact step for the failure mode this step prevents).
      - name: Download Loom assets
        if: matrix.suite == 'forge'
        run: ./gradlew :forge:downloadAssets
        timeout-minutes: 10


      # As of the Minecraft 1.20.2 / Forge 48.1.0 bump, `/test runall` (batching every registered
      # test into one grid-laid-out run - the approach this step used to take) is unusable: two
      # real, undocumented bugs in vanilla/Forge's own GameTest framework (not this mod's code -
      # confirmed by disassembling net.minecraft.gametest.framework.* across both Forge 47.4.10
      # and 48.1.0; a web research pass found no matching Mojang/Forge/NeoForge bug report or
      # fix in any later 48.x patch - 48.1.0 is the last 48.x release):
      #   1. `/test runall`'s grid-placement path (GameTestRunner.runTestBatches) fails
      #      synchronously with NO exception logged anywhere (checked both INFO and full DEBUG
      #      Forge logs) - the console just prints "An unexpected error occurred trying to
      #      execute that command" within milliseconds of "Running all N tests..." and not one
      #      test ever starts.
      #   2. Running a test individually via `/test run <name>` DOES work correctly - the test's
      #      own body executes and this mod's own "<name>: passed"/"<name>: failed" log line
      #      fires - but the moment the vanilla framework's own post-test reporting listener
      #      (ReportGameListener.testPassed -> spawnBeacon) tries to place a celebratory beacon
      #      at the test's structure position, GameTestInfo#getStructureBlockPos() returns null
      #      and the resulting NullPointerException is uncaught in the server tick loop, crashing
      #      the *entire* dedicated server - not just that one test.
      # Bug 2 means only one test can ever complete per server boot. So this step boots a fresh
      # `:forge:runGameTestServer` once per test, drives `/test run <name>` (not `runall`), reads
      # that one test's own pass/fail log line, and moves on to the next boot - accepting the
      # post-pass crash as expected/harmless (the log line and gameplay behavior are already
      # captured by the time it happens; "wait" below is `|| true` specifically to swallow that
      # crash's non-zero exit rather than fail the step on it).
      #
      # Completion is detected via each @GameTest method's own "<name>: passed"/"<name>: failed"
      # log line (see forge/.../gametest/*.java) - Vanilla's TestCommand summary line ("All
      # required tests passed :)") was already confirmed, independently of the above, to never
      # print when driven from a piped console with no player attached.
      #
      # allmodbiomesappearinoverworldgeneration gets its own long per-test timeout:
      # findClosestBiome3d has no early exit for a biome that's absent (or outside the search
      # box) - it walks the *entire* 15000-block radius, which costs ~30-40s per biome for a
      # normal FULL_RANGE-depth search, but biomes constrained to ParameterUtils.Depth.FLOOR (see
      # the EULA/max-tick-time step above) can each individually cost close to the raised 1000s
      # max-tick-time ceiling. The other 6 tests are cheap structural/registry checks - a much
      # shorter per-boot timeout is generous headroom for CI-runner variance in boot time alone.
      - name: Run GameTests
        if: matrix.suite == 'forge'
        run: |
          declare -A TEST_TIMEOUTS=(
            [allmodbiomesappearinoverworldgeneration]=1200
            [everyspawneggresolvesrequiredfeatureswithoutthrowing]=180
            [skycityappearsinoverworldgeneration]=180
            [junglegetsundergroundjunglefeaturesandspawns]=180
            [mushroomfieldsgetshugemushroomsandspawns]=180
            [darkforestgetshugemushrooms]=180
            [plainsgetsharpyspawn]=180
          )

          : > gametest.log
          FAILED=0
          for t in "${!TEST_TIMEOUTS[@]}"; do
            echo "=== $t ===" | tee -a gametest.log
            mkfifo "gt-$t.fifo"
            timeout "${TEST_TIMEOUTS[$t]}" ./gradlew :forge:runGameTestServer < "gt-$t.fifo" > "gt-$t.log" 2>&1 &
            GPID=$!
            # A fast-passing test can crash the server (see the post-pass beacon-placement bug
            # documented above) before this subshell's second write, closing the fifo's read end -
            # that write then fails with a broken-pipe SIGPIPE, and since this step's shell runs
            # under `set -e` (GitHub's default bash mode), an unguarded failure here would abort
            # the whole loop after just one test (observed: plainsGetsHarpySpawn passing almost
            # instantly and killing every later iteration). `|| true` on each write, same as
            # `wait "$GPID" || true` below, makes that expected race harmless instead of fatal.
            ( sleep 60; echo "test run $t" || true; sleep 60; echo "stop" || true ) > "gt-$t.fifo" || true
            wait "$GPID" || true

            if grep -qE ': failed$' "gt-$t.log"; then
              echo "::error::$t failed - see gametest.log"
              FAILED=1
            elif ! grep -qE ': passed$' "gt-$t.log"; then
              echo "::error::$t never reported pass/fail (server likely didn't boot/finish in time) - see gametest.log"
              FAILED=1
            fi

            cat "gt-$t.log" >> gametest.log
            rm -f "gt-$t.fifo" "gt-$t.log"
          done

          exit "$FAILED"
        shell: bash


      - name: Upload GameTest log
        if: always() && matrix.suite == 'forge'
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-gametest-log
          path: "ExtraBiomes - Java/gametest.log"
          if-no-files-found: ignore

      # Same level-seed/max-tick-time reasoning as the Forge EULA step above, in NeoForge's own run dir.
      - name: Accept Minecraft EULA for the NeoForge test server
        if: matrix.suite == 'neoforge'
        run: |
          mkdir -p neoforge/run
          echo "eula=true" > neoforge/run/eula.txt
          printf 'max-tick-time=1000000\nlevel-seed=extrabiomes\n' > neoforge/run/server.properties


      - name: Download NeoForge Loom assets
        if: matrix.suite == 'neoforge'
        run: ./gradlew :neoforge:downloadAssets
        timeout-minutes: 10


      # Unlike Forge (see the Forge "Run GameTests" step's own comment for the two framework bugs
      # that force it to drive tests one at a time), NeoForge's GameTestServer here has neither
      # bug: it auto-runs every registered @GameTest as soon as it boots (like Fabric's) and exits
      # cleanly afterward, reporting "All N required tests passed :)" - confirmed locally, all 7
      # tests across the 4 neoforge gametest classes pass on a single boot with no post-pass
      # crash. A single `timeout`-wrapped run, no fifo/per-test driving needed.
      - name: Run NeoForge GameTests
        if: matrix.suite == 'neoforge'
        run: timeout 600 ./gradlew :neoforge:runGameTestServer | tee neoforge-gametest.log
        shell: bash


      - name: Upload NeoForge GameTest log
        if: always() && matrix.suite == 'neoforge'
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-neoforge-gametest-log
          path: "ExtraBiomes - Java/neoforge-gametest.log"
          if-no-files-found: ignore

      # Its own job now, so it can't lean on NeoForge's downloadAssets having filled Loom's asset cache.
      - name: Download Fabric Loom assets
        if: matrix.suite == 'fabric'
        run: ./gradlew :fabric:downloadAssets
        timeout-minutes: 10


      # Same level-seed and max-tick-time reasoning as the Forge EULA/seed step above - Fabric's
      # run/ dir gets a clean checkout every CI run too, so it needs its own pinned seed for a
      # deterministic biome search, and its BiomeGenerationGameTests (fabric/.../gametest) walks
      # the same FLOOR-depth-constrained ServerLevel#findClosestBiome3d searches as Forge's, so it
      # needs the same raised ceiling to avoid the vanilla-default 60s watchdog killing it mid-sweep.
      - name: Pin seed for the Fabric test server
        if: matrix.suite == 'fabric'
        run: |
          mkdir -p fabric/run
          printf 'max-tick-time=1000000\nlevel-seed=extrabiomes\n' > fabric/run/server.properties


      # Unlike Forge's dedicated server, Fabric API's gametest server auto-runs every registered
      # @GameTest as soon as world gen finishes (driven by the -Dfabric-api.gametest=true vmArg in
      # fabric/build.gradle) and then exits on its own - no interactive console driving needed.
      # 3000s mirrors the Forge GameTest step's reasoning: most of the 26 biome sweeps cost
      # 30-40s, but the FLOOR-depth ones can each individually approach the 1000s max-tick-time
      # ceiling above.
      - name: Run Fabric GameTests
        if: matrix.suite == 'fabric'
        run: timeout 3000 ./gradlew :fabric:runGameTestServer | tee fabric-gametest.log
        shell: bash


      - name: Upload Fabric GameTest log
        if: always() && matrix.suite == 'fabric'
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-fabric-gametest-log
          path: "ExtraBiomes - Java/fabric-gametest.log"
          if-no-files-found: ignore


      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: ./gradlew :common:test
        continue-on-error: true
        timeout-minutes: 10


      - name: Upload test report
        if: always() && matrix.suite == 'unit'
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-test-report
          path: "ExtraBiomes - Java/common/build/reports/tests/test/"
          if-no-files-found: ignore

  package:
    # Runs beside the test stage rather than after it; the build job below gates the run on both.
    needs: [setup, datagen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ExtraBiomes - Java"
    timeout-minutes: 20
    steps:
      - *checkout
      - *jdk
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          # Only jobs that launch Minecraft need Loom's assets; leaving them out shrinks this job's cache restore.
          gradle-home-cache-excludes: caches/fabric-loom/assets
      - *gradlew
      - *loomcache
      - name: Download generated data
        uses: actions/download-artifact@v8
        with:
          name: extrabiomes-generated-resources
          path: "ExtraBiomes - Java/common/src/generated/resources"


      # Runs (and uploads) even when an earlier GameTest step failed - a manually-downloadable jar
      # to test against is useful precisely when the automated biome-placement check disagrees
      # with local results, so a real failure here shouldn't also block getting a jar out.
      - name: Build with Gradle
        run: ./gradlew build -x test
        timeout-minutes: 15


      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-build
          path: "ExtraBiomes - Java/forge/build/libs/*.jar"
          if-no-files-found: ignore


      - name: Upload Fabric build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-fabric-build
          path: "ExtraBiomes - Java/fabric/build/libs/*.jar"
          if-no-files-found: ignore


      - name: Upload NeoForge build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-neoforge-build
          path: "ExtraBiomes - Java/neoforge/build/libs/*.jar"
          if-no-files-found: ignore

  build:
    # Branch protection requires 'build', so this is the job that fails when any stage failed.
    needs: [setup, datagen, test, package]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check every stage passed
        run: |
          echo "datagen=${{ needs.datagen.result }} test=${{ needs.test.result }} package=${{ needs.package.result }}"
          [ "${{ needs.datagen.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.package.result }}" = success ]
