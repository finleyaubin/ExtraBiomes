name: Build Forge Mod

on:
  push:
    branches:
      - main
      - Java-Dev
  pull_request:
    branches:
      - main
      - Java-Dev

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "ExtraBiomes - Forge"
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate data
        run: ./gradlew runData

      - name: Run unit tests
        run: ./gradlew test
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-test-report
          path: "ExtraBiomes - Forge/build/reports/tests/test/"
          if-no-files-found: ignore

      - name: Run GameTests
        run: ./gradlew runGameTestServer | tee gametest.log
        shell: bash

      - name: Upload GameTest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-gametest-log
          path: "ExtraBiomes - Forge/gametest.log"
          if-no-files-found: ignore

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-build
          path: "ExtraBiomes - Forge/build/libs/*.jar"
