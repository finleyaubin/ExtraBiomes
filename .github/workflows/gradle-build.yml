name: Build Mod

on:
  push:
    branches:
      - main
      - Java-Dev
      - multiloader-architectury
  pull_request:
    branches:
      - main
      - Java-Dev
      - multiloader-architectury

jobs:
  build:
    runs-on: ubuntu-latest
    # Sum of this job's own step timeouts: downloadAssets(10) + runData(10) + unit tests(10) +
    # Run GameTests(15, via its inline `timeout 900`) + Run Fabric GameTests(15, same) +
    # final build(15) = 75 minutes, plus headroom for checkout/setup-java/setup-gradle/EULA
    # steps (uncapped but fast). A job timeout below that sum kills everything with no
    # diagnostics before a slow step's own timeout/watchdog gets a chance to fire.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: "ExtraBiomes - Java"
    steps:
      - uses: actions/checkout@v7

      # Loom's toolchain compiles for 17, but the Gradle daemon itself needs 21 to run
      # (a loom dependency requires JVM runtime 21+). Installing both lets Gradle's toolchain
      # support auto-detect the 17 JDK for compilation while running on 21.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # runGameTestServer boots a real dedicated server, which refuses to start without this.
      # Also pre-seed server.properties with a moderately raised max-tick-time:
      # BiomeGenerationGameTests runs each of its 26 mod-biome ServerLevel#findClosestBiome3d
      # searches (15000-block radius, real Perlin noise, no shortcuts) as its own
      # GameTestSequence step on its own server tick, specifically so no single tick has to
      # absorb more than one biome's worst case - a biome that's genuinely absent (or outside the
      # search box) makes findClosestBiome3d walk the *entire* radius with no early exit, which
      # alone can take 30+ seconds on a shared CI runner (confirmed via a captured crash report:
      # eight consecutive full/failed sweeps averaged ~34s each). 120000ms (2 min) gives a single
      # such sweep generous headroom above that observed worst case while still letting the
      # watchdog catch a genuinely hung tick reasonably promptly, instead of disabling it
      # outright - unlike before this test was split per-tick, a bounded value is safe again here
      # since it only ever has to cover one biome's sweep, not the sum of all 26.
      # Also pin level-seed: CI checks out a clean workspace every run, so with no seed set
      # Minecraft generates a brand-new random world each time, and TerraBlender's noise-based
      # biome placement can push most mod biomes outside the fixed 15000-block search box on an
      # unlucky seed (observed: 17/26 biomes "missing" on one CI run vs 1/26 locally, where the
      # persisted run/world/ dir happened to keep reusing the same lucky seed across runs). A
      # fixed seed makes the test's result deterministic across both environments; kept even
      # after narrowing the Jungle Pillars/Fungle Jungle climate-box overlap (see
      # ModOverworldRegion.java) since determinism across CI runs is worth it regardless.
      - name: Accept Minecraft EULA for the local test server
        run: |
          mkdir -p forge/run
          echo "eula=true" > forge/run/eula.txt
          printf 'max-tick-time=120000\nlevel-seed=extrabiomes\n' > forge/run/server.properties

      # Architectury Loom's shared asset cache (~/.gradle/caches/fabric-loom/assets) isn't
      # populated until this runs at least once. Without it, runData's forked JVM throws
      # "Cannot parse argument '.../fabric-loom/assets' of option assetsDir" and - since Loom's
      # dev-launch wrapper never calls System.exit() after an early crash like this - just hangs
      # forever instead of failing, eating the whole job's time budget (see the 2026-08-19 CI run
      # that hit the 6-hour ceiling on this exact step for the failure mode this step prevents).
      - name: Download Loom assets
        run: ./gradlew :forge:downloadAssets
        timeout-minutes: 10

      - name: Generate data
        run: ./gradlew :forge:runData
        timeout-minutes: 10

      - name: Run unit tests
        run: ./gradlew :common:test
        continue-on-error: true
        timeout-minutes: 10

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-test-report
          path: "ExtraBiomes - Java/common/build/reports/tests/test/"
          if-no-files-found: ignore

      # runGameTestServer boots a plain dedicated server with the gametest namespace enabled -
      # it doesn't run tests or exit on its own, so we drive its console: wait for world gen to
      # finish, trigger the tests, wait for them to finish, then stop the server. The overall
      # timeout is a hard ceiling so a hang here can't run up the CI bill.
      #
      # The test-wait window (1500s) has to cover BiomeGenerationGameTests' worst case, not its
      # typical case: findClosestBiome3d has no early exit for a biome that's absent (or outside
      # the 15000-block search box) - it walks the *entire* radius, which alone can take 30+
      # seconds per biome on a shared runner (confirmed via a captured crash report showing eight
      # consecutive full/failed sweeps costing 272s in under 5 minutes, before a since-removed
      # max-tick-time cap killed the server mid-run). With up to 26 biomes potentially needing a
      # full sweep, sending "stop" too early would cut the test off mid-search rather than let it
      # report a real pass/fail - 1500s gives headroom for every biome needing the worst case
      # (~26 * 40s = 1040s) plus margin, instead of guessing from the common case.
      # forge:runGameTestServer's own exit code can't be trusted: ExtraBiomesForge's exit
      # watchdog (see startGameTestExitWatchdogIfRunningGameTestServer) always halts the JVM
      # with code 0 once the driven-console server shuts down, regardless of whether any
      # @GameTest actually failed - its only job is making sure the process doesn't hang, not
      # reporting results. Vanilla's TestCommand prints one of two fixed summary lines
      # ("All required tests passed :)" / "N required tests failed :(") once `test runall`
      # finishes, so grep the captured log for those instead of trusting the exit code.
      - name: Run GameTests
        run: |
          (sleep 60 && echo "test runall" && sleep 1500 && echo "stop") | timeout 1800 ./gradlew :forge:runGameTestServer | tee gametest.log
          if grep -q "required tests failed" gametest.log; then
            echo "::error::One or more required GameTests failed - see gametest.log"
            exit 1
          fi
          if ! grep -q "All required tests passed" gametest.log; then
            echo "::error::GameTest run never reported a pass/fail summary (server likely didn't finish in time) - see gametest.log"
            exit 1
          fi
        shell: bash

      - name: Upload GameTest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-gametest-log
          path: "ExtraBiomes - Java/gametest.log"
          if-no-files-found: ignore

      # Same level-seed reasoning as the Forge EULA/seed step above - Fabric's run/ dir gets a
      # clean checkout every CI run too, so it needs its own pinned seed for a deterministic
      # biome search.
      - name: Pin seed for the Fabric test server
        run: |
          mkdir -p fabric/run
          printf 'level-seed=extrabiomes\n' > fabric/run/server.properties

      # Unlike Forge's dedicated server, Fabric API's gametest server auto-runs every registered
      # @GameTest as soon as world gen finishes (driven by the -Dfabric-api.gametest=true vmArg in
      # fabric/build.gradle) and then exits on its own - no interactive console driving needed.
      - name: Run Fabric GameTests
        run: timeout 900 ./gradlew :fabric:runGameTestServer | tee fabric-gametest.log
        shell: bash

      - name: Upload Fabric GameTest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-fabric-gametest-log
          path: "ExtraBiomes - Java/fabric-gametest.log"
          if-no-files-found: ignore

      - name: Build with Gradle
        run: ./gradlew build
        timeout-minutes: 15

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-forge-build
          path: "ExtraBiomes - Java/forge/build/libs/*.jar"

      - name: Upload Fabric build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extrabiomes-fabric-build
          path: "ExtraBiomes - Java/fabric/build/libs/*.jar"
