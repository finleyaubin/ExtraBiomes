name: Build & Publish MCAddon

on:
  workflow_dispatch:
  push:
    tags:
      - 'Bedrock-*'
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - name: Set repo name
        id: vars
        run: |
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      # Extract a clean version string like "3.0.0-beta3" from either
      # "v3.0.0" or "Bedrock-V3.0.0-beta2" style tags
      - name: Extract version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          # strip "Bedrock-" prefix if present
          TAG="${TAG#Bedrock-}"
          # strip leading v/V
          TAG="${TAG#v}"
          TAG="${TAG#V}"
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Detect prerelease tag
        id: prerelease
        run: |
          TAG=${{ github.ref_name }}
          TAG=${TAG#refs/tags/}
          echo "IS_PRERELEASE=${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}" >> $GITHUB_OUTPUT

      - name: Build the MCAddon
        id: build
        run: |
          FILENAME="${{ steps.vars.outputs.REPO_NAME }}_${{ steps.version.outputs.VERSION }}.mcaddon"
          echo "FILENAME=$FILENAME" >> $GITHUB_OUTPUT

          cd "ExtraBiomes - Bedrock/packs/"
          mkdir -p ../tmp
          cp -r BP ../tmp/BP
          cp -r RP ../tmp/RP
          cd ../tmp
          zip -r "../$FILENAME" *
          mv "../$FILENAME" "$GITHUB_WORKSPACE"

      - name: Upload MCAddon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.FILENAME }}
          path: ${{ steps.build.outputs.FILENAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.FILENAME }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Upload to CurseForge"
        uses: itsmeow/curseforge-upload@v3
        with:
          file_path: ${{ steps.build.outputs.FILENAME }}
          display_name: ${{ steps.build.outputs.FILENAME }}
          game_endpoint: "minecraft"
          game_versions: "26.30"
          project_id: "918166"
          release_type: ${{ contains(github.ref_name, '-beta') && 'beta' || contains(github.ref_name, '-alpha') && 'alpha' || 'release' }}
          token: "${{ secrets.CF_API_TOKEN }}"