name: Zip & Publish MCAddon

on:
  workflow_dispatch:   # manual trigger
  push:
    tags:
      - 'v*'            # automatic release on a vX.Y.Z tag

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
# Get the repo
      - uses: actions/checkout@v4

#Store repo name (Extrabiomes) in a reusable variable
      - name: Set repo name
        id: vars
        run: |
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

#Build the .mcaddon – **inside the right directory**!
      - name: Build the addon
        run: |
          # Path with the space in the folder name → quote it
          cd "ExtraBiomes - Bedrock/packs/"

          # Remove an old build if it exists (no‑error)
          rm -f "${{ steps.vars.outputs.REPO_NAME }}.mcaddon"

          # Zip the folder that bears the repo name
          zip -r "${{ steps.vars.outputs.REPO_NAME }}.mcaddon" \
              "${{ steps.vars.outputs.REPO_NAME }}" \
              -x ".git/*" ".github/*"

#keep the zip as an artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.REPO_NAME }}.mcaddon
          path: "ExtraBiomes - Bedrock/packs/${{ steps.vars.outputs.REPO_NAME }}.mcaddon"

#Create or update a GitHub Release
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}          # e.g. v1.0.0
          release_name: ${{ steps.vars.outputs.REPO_NAME }} MCAddon ${{ github.ref_name }}
          files: "ExtraBiomes - Bedrock/packs/${{ steps.vars.outputs.REPO_NAME }}.mcaddon"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
