name: Build & Publish MCAddon

#Triggers
on:
  workflow_dispatch:            # manual run
  push:
    tags:
      - 'v*'                     # e.g. v3.0.0
      - 'Bedrock-*'              # e.g. Bedrock-V3.0.0-beta2
  release:
    types: [published]          # when you create/modify a release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:

      # ──────────────────────────────────────────────────────
      #Checkout the repo
      - uses: actions/checkout@v4

      #Grab the repo name (Extrabiomes) – we’ll reuse it
      - name: Set repo name
        id: vars
        run: |
          echo "REPO_NAME=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT

      #Detect if the tag contains “beta” (or any other string)
      - name: Detect prerelease tag
        id: prerelease
        run: |
          TAG=${{ github.ref_name }}
          # Strip the leading "refs/tags/" if you’re on the release event
          TAG=${TAG#refs/tags/}
          echo "IS_PRERELEASE=${TAG#*-beta}" | grep -q $TAG && echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT || echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
        # (More compact alternative:)
        #   echo "IS_PRERELEASE=${{ contains(github.ref_name, '-beta') }}" >> $GITHUB_OUTPUT

      #Build the zip (BP + RP)
      - name: Build the MCAddon
        run: |
          cd "ExtraBiomes - Bedrock/packs/"
          # Create a clean temp folder
          mkdir -p ../tmp
          cp -r BP ../tmp/BP
          cp -r RP ../tmp/RP
          # Zip *only* the two folders – keeps the required top‑level structure
          cd ../tmp
          zip -r ../${{ steps.vars.outputs.REPO_NAME }}.mcaddon *
          # Move the zip back into the working tree (optional)
          mv ../${{ steps.vars.outputs.REPO_NAME }}.mcaddon $GITHUB_WORKSPACE

      #Upload the zip as an artifact (so you can download it from the run)
      - name: Upload MCAddon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.REPO_NAME }}.mcaddon
          path: ${{ steps.vars.outputs.REPO_NAME }}.mcaddon

      # ──────────────────────────────────────────────────────
      #Publish the release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.vars.outputs.REPO_NAME }}.mcaddon
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
