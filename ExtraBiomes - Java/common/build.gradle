architectury {
    common(rootProject.enabled_platforms.split(","))
}

// :common:remapJar (Loom's default per-subproject task) tries to remap common's generic jar to
// official names on its own, independent of any specific loader - but nothing in this build
// actually consumes that output: fabric/build.gradle and neoforge/build.gradle both depend on
// common's "namedElements" configuration (the un-remapped dev jar) instead, remapping happens as
// part of each loader's own transformProduction<Loader>/remapJar via the shadow jar. This task
// started failing on the 1.20.6 bump with "Unfixable conflicts" from architectury-loom's shared
// official-mappings resolution colliding on vanilla's new CustomQueryPayload/DiscardedQueryPayload
// class split (introduced in 1.20.5) against net/minecraftforge/network/ForgePayload - a real
// upstream Loom bug (architectury/architectury-loom#335, open/unresolved as of this bump, no fix
// in the newest 1.17.491 build) that reproduces even though Forge isn't in enabled_platforms,
// since Loom's merged mapping data for a Forge-supporting MC version apparently isn't scoped per
// project. Disabled rather than worked around, since disabling costs nothing here.
tasks.named("remapJar") { enabled = false }
tasks.named("remapSourcesJar") { enabled = false }

// Datagen output (see forge/build.gradle's data run) lands here. Without this, the generated
// datapack JSON (biomes, tags, recipes, loot tables, ...) only exists on disk for tests to read
// directly - it's never actually packaged into the mod, so none of it exists at runtime.
sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    // Fabric loader is only needed on the common compile classpath for @Environment annotations
    // and mixin dependencies. No fabric module exists yet in this project — keep this even so,
    // it costs nothing and saves a step when a fabric module is added later.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // Powers @ExpectPlatform: common declares the method signature, the forge module provides
    // the real implementation in ExtraBiomesExpectPlatformImpl (see platform/ package) for the
    // handful of hooks (custom Block subclasses with Forge-only overrides, AT-gated vanilla
    // calls) that need a genuinely Forge-patched class to compile.
    annotationProcessor "dev.architectury:architectury-injectables:1.0.13"

    // TerraBlender's API package (terrablender.api.*) is identical across its forge/fabric
    // artifacts, so common code against it compiles fine without a platform choice here.
    // Resolved through Modrinth's Maven proxy rather than JitPack's com.github.glitchfiend
    // coordinate (see root build.gradle) - the version segment is the Modrinth file ID for
    // TerraBlender-forge ${minecraft_version}-${terrablender_version}, since Modrinth's "version
    // number" alone is ambiguous between its forge and fabric/quilt uploads.
    modCompileOnly "maven.modrinth:terrablender:${terrablender_modrinth_id}"

    // ModLeavesWithSupport is the last remaining common class with a direct net.minecraftforge
    // import (IForgeShearable, a marker interface with no vanilla/cross-loader equivalent) - see
    // scripts/verify_common_isolation.py. Everything else that needed Forge-only types
    // (Config/ModItems/ModFluids/ModFluidTypes/BaseFluidType/ModLogs/FrogHelmetItem) has since
    // moved out to forge/'s own packages or been rewritten loader-agnostically now that the
    // fabric module needs real implementations too. The "universal" classifier exposes Forge's
    // own authored classes (not SRG-obfuscated, unlike vanilla Minecraft symbols in this jar) so
    // it's safe to reference at compile time without Loom's remapping.
    compileOnly "net.minecraftforge:forge:${minecraft_version}-${forge_version}:universal"
    // javax.annotation.Nullable (JSR-305) — pulled in transitively via ForgeGradle previously,
    // not automatically present under Loom.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
