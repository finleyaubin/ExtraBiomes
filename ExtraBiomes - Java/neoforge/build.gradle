plugins {
    id "com.gradleup.shadow" version "9.6.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// No 1.20.4 Create build exists yet (see forge/build.gradle's identical note) - CreateWindmillCompat
// imports real Create classes and can't compile without it. Excluded wholesale rather than left to
// fail the build; re-include once Create ships a NeoForge 1.20.4 build.
sourceSets.main.java {
    exclude 'net/winepicfin/extrabiomes/neoforge/compat/create/**'
}

loom {
    // Unlike Forge's platform (fully automatic pickup), NeoForge needs the AT file registered
    // explicitly - confirmed via net.fabricmc.loom.api.NeoForgeExtensionAPI#accessTransformer;
    // without this, FireBlock#setFlammable/WolfModel#head/MobCategory#max all stayed private on
    // the neoforge-specific merged Minecraft jar even though the identical .cfg content applied
    // fine automatically on forge/. NeoForge 1.20.4 still shares Forge's AT mechanism and
    // obfuscation/SRG mapping data (the two hadn't diverged mapping-wise yet at this MC version -
    // confirmed via the 20.4.251 userdev config.json, unchanged since the 1.20.2 port).
    neoForge {
        accessTransformer(file("src/main/resources/META-INF/accesstransformer.cfg"))
    }
    runs {
        client {
            configName = "NeoForge Client"
            client()
            source sourceSets.main
        }
        server {
            configName = "NeoForge Server"
            server()
            source sourceSets.main
        }
        data {
            configName = "NeoForge Data"
            // NeoForge 1.20.4's userdev config.json still only defines a single "data" run
            // template (unlike newer NeoForge, which splits it into dataClient/dataServer) -
            // confirmed via its config.json's "runs" keys: client/data/gameTestServer/server.
            // clientData() looks up a "dataClient" template that doesn't exist at this version
            // and fails with "Could not find Forge run template with name 'dataClient'".
            data()
            programArgs '--mod', mod_id, '--all', '--output', project(':common').file('src/generated/resources').absolutePath, '--existing', project(':common').file('src/main/resources').absolutePath
            runDir "run-data"
        }
        gameTestServer {
            configName = "NeoForge Game Test Server"
            server()
            source sourceSets.main
            // NeoForge's GameTestHooks reads its own "neoforge.enabledGameTestNamespaces" system
            // property (see net.neoforged.neoforge.gametest.GameTestHooks#getEnabledNamespaces),
            // not Forge's "forge.enabledGameTestNamespaces" - copying forge/build.gradle's vmArg
            // unchanged left /test entirely unregistered ("Unknown or incomplete command" on
            // both `/test list` and `/test run <name>`). GameTestHooks#registerGametests gates
            // registration on isGametestEnabled(), which "-Dneoforge.enableGameTest=true" alone
            // already satisfies - deliberately NOT setting "-Dneoforge.gameTestServer=true" here.
            // That flag makes NeoForge's patched net.minecraft.server.Main branch into building
            // the dedicated server via vanilla's net.minecraft.gametest.framework.GameTestServer
            // instead of the normal DedicatedServer path - and GameTestServer's own
            // WorldLoader$WorldDataSupplier unconditionally bakes the world from
            // WorldPresets.FLAT (confirmed via NeoForge's own Main.java.patch), giving every test
            // world a single-biome FixedBiomeSource overworld no matter what TerraBlender does -
            // structurally incapable of ever containing a second biome. Leaving this flag off
            // boots the same server() run this project already uses elsewhere (normal
            // DedicatedServer, server.properties' level-type=minecraft:normal, a real
            // MultiNoiseBiomeSource overworld) with gametests still registered - see the "Run
            // GameTests" step's own comment for how this drives /test against it.
            vmArgs "-Dneoforge.enabledGameTestNamespaces=${mod_id}", "-Dneoforge.enableGameTest=true"
        }
    }
}

// Same reasoning as forge/build.gradle's clearGameTestWorld - a leftover run/world/ save from a
// previous run would silently keep its own untracked seed instead of the pinned one.
tasks.register("clearGameTestWorld", Delete) {
    delete file("run/world")
}
tasks.named("runGameTestServer") {
    dependsOn "clearGameTestWorld"
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    // NeoForge 1.20.4 is still obfuscated the same way Forge is - NeoForge didn't remove
    // obfuscation until the 26.1 line, years after this MC version - so this module uses the
    // regular remap-aware "dev.architectury.loom" plugin and its "mod"-prefixed configurations,
    // same as forge/fabric (confirmed on the 1.20.2 port: applying "dev.architectury.loom-no-remap"
    // here throws "The Minecraft version '...' is obfuscated. Forge / NeoForge support for
    // obfuscated Minecraft is through the regular dev.architectury.loom plugin instead" - an
    // explicit, unambiguous Loom error).
    neoForge "net.neoforged:neoforge:${neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${architectury_api_version}"

    // Resolved through Modrinth's Maven proxy - see common/build.gradle and root build.gradle for why.
    modImplementation "maven.modrinth:terrablender:${terrablender_neoforge_modrinth_id}"

    // GeckoLib's native NeoForge 1.20.4 artifact still bundles mclib via Jar-in-Jar
    // (META-INF/jarjar/mclib-20.jar) rather than shipping it directly in its own classes -
    // same "Loom's dev classpath doesn't extract jar-in-jars, and FML's per-mod module
    // isolation can't see mclib even when it's resolved as its own dependency" problem as
    // forge/build.gradle's geckolib+mclib comment (confirmed here too: NoClassDefFoundError
    // on com.eliotlash.mclib.math.IValue during GeckoLib's animation loading on a real
    // `runClient`). Same fix: libs/geckolib-neoforge-1.20.4-4.4.4-with-mclib.jar is
    // geckolib-neoforge-1.20.4-4.4.4.jar with mclib-20.jar's classes merged in (mclib's
    // META-INF excluded, GeckoLib's kept); regenerate by re-running the equivalent of:
    //   unzip geckolib-neoforge-1.20.4-4.4.4.jar -d tmp/ && unzip -o mclib-20.jar -d tmp/ -x "META-INF/*"
    //   (cd tmp && zip -r ../libs/geckolib-neoforge-1.20.4-4.4.4-with-mclib.jar .)
    // if bumping geckolib_version or mclib's "20".
    modImplementation files("libs/geckolib-neoforge-1.20.4-4.4.4-with-mclib.jar")

    // Optional/soft dependency, compile-only - see neoforge/compat/create/CreateWindmillCompat.java
    // and platform/neoforge/ExtraBiomesExpectPlatformImpl#applyWindmillCreateCompat. Same deal as
    // forge/build.gradle's Create dependency: no 1.20.4 Create build exists for NeoForge either
    // (as of 2026-08-28) - re-enable when one ships.
    // modCompileOnly("com.simibubi.create:create-neoforge-1.20.4:...") { transitive = false }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_authors", mod_authors
    inputs.property "mod_description", mod_description
    inputs.property "neoforge_version_range", neoforge_version_range
    inputs.property "neoforge_loader_version_range", neoforge_loader_version_range
    inputs.property "minecraft_version_range", minecraft_version_range

    filesMatching(['META-INF/mods.toml']) {
        expand([
                version                       : project.version,
                mod_id                        : mod_id,
                mod_name                      : mod_name,
                mod_authors                   : mod_authors,
                mod_description               : mod_description,
                neoforge_version_range        : neoforge_version_range,
                neoforge_loader_version_range : neoforge_loader_version_range,
                minecraft_version_range       : minecraft_version_range,
        ])
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
    archiveFileName = "${archives_base_name}-neoforge-v${mod_version}-${minecraft_version}.jar"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}
