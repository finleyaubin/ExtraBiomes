# Loom itself needs this set as a real project property (not just via the architectury {
# neoForge() } DSL call) - without it, the "neoForge" dependency configuration never gets
# registered ("Could not find method neoForge() for arguments [...]"), even though the regular
# "dev.architectury.loom" plugin (applied uniformly to every subproject, same as forge/fabric -
# NeoForge 1.20.2 is still obfuscated, so it needs the same remap-aware plugin they use, not the
# newer "dev.architectury.loom-no-remap" variant meant for later non-obfuscated NeoForge
# versions) and architectury { neoForge() } are both already correctly in place.
loom.platform=neoforge
