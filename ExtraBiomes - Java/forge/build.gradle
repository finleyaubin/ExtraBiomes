plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

// No 1.20.2 Create build exists yet (see the modCompileOnly Create/Registrate lines below) -
// CreateWindmillCompat imports real Create classes and can't compile without it. Excluded
// wholesale rather than left to fail the build; re-include once Create ships for 1.20.2.
sourceSets.main.java {
    exclude 'net/winepicfin/extrabiomes/forge/compat/create/**'
}

loom {
    // src/main/resources/META-INF/accesstransformer.cfg is picked up automatically by Loom's forge platform.
    runs {
        client {
            configName = "Forge Client"
            client()
            source sourceSets.main
        }
        server {
            configName = "Forge Server"
            server()
            source sourceSets.main
        }
        data {
            configName = "Forge Data"
            data()
            // Output goes into common/src/generated/resources, not this module's own
            // src/main/generated: datapack content is loader-agnostic and the common-module
            // tests (e.g. BiomeRegistrationParityTest) read it from there via a path relative
            // to common's own project directory.
            programArgs '--mod', mod_id, '--all', '--output', project(':common').file('src/generated/resources').absolutePath, '--existing', project(':common').file('src/main/resources').absolutePath
            // Own working directory, separate from "run" (the default, shared with
            // client/server/gameTestServer): bootstrapping structure/registry context for data
            // generation creates a throwaway world save (confirmed locally - forge/run/world/
            // level.dat appears after a bare `./gradlew :forge:runData` against an empty run
            // dir) with whatever seed that bootstrap happens to use, not the one CI/local pin in
            // run/server.properties for the GameTest server. Left in the shared "run" dir, that
            // leftover level.dat would already exist by the time runGameTestServer starts, and
            // since Minecraft only reads level-seed from server.properties when *creating* a
            // world, the pinned seed would be silently ignored in favour of whatever datagen's
            // throwaway world used - exactly what was happening before this was split out.
            runDir "run-data"
        }
        gameTestServer {
            configName = "Forge Game Test Server"
            server()
            source sourceSets.main
            vmArgs "-Dforge.enabledGameTestNamespaces=${mod_id}"
        }
    }
}

// Minecraft only reads server.properties' level-seed when *creating* a world - a leftover
// run/world/ save from a previous local run (or from runData leaking into the shared "run" dir,
// see the comment on the data run config above) silently keeps whatever seed it already has, so
// the pinned CI/local seed is ignored and BiomeGenerationGameTests' 15000-block search runs
// against an untracked world instead of the deterministic one the pinned seed is meant to
// guarantee (confirmed locally: a stale Aug-23 save produced a materially different
// floating_jungle search result than a fresh world on the same pinned seed). Deleting the save
// before every runGameTestServer invocation makes that seed pin actually mean something.
tasks.register("clearGameTestWorld", Delete) {
    delete file("run/world")
}
tasks.named("runGameTestServer") {
    dependsOn "clearGameTestWorld"
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    modApi "dev.architectury:architectury-forge:${architectury_api_version}"

    // Resolved through Modrinth's Maven proxy - see common/build.gradle for why.
    modImplementation "maven.modrinth:terrablender:${terrablender_modrinth_id}"
    // GeckoLib bundles a small math library (mclib) via Forge's Jar-in-Jar mechanism
    // (META-INF/jarjar/mclib-20.jar), which a real Forge launch unpacks automatically but
    // Loom's dev classpath does not - every dev run logs "[JarInJarDependencyLocator] No
    // dependencies to load found", and mclib never shows up as its own "Found mod file" the
    // way geckolib/terrablender/architectury do. Declaring mclib as its own
    // (mod)Implementation/include() dependency, or even baking its .class files directly into
    // this mod's own compiled output, resolves it onto the classpath Gradle sees, but
    // GeckoLib's module still can't see it at runtime (NoClassDefFoundError on
    // com.eliotlash.mclib.math.IValue) - FML's per-mod modules only read the modules their own
    // mods.toml declares a dependency on, same as real JPMS `requires`, not "every other module
    // in the layer". The only module GeckoLib's own classes are guaranteed to read is GeckoLib's
    // own module, so mclib has to physically live inside GeckoLib's jar - exactly what Forge's
    // (non-functional-here) Jar-in-Jar step would normally have done.
    //
    // libs/geckolib-forge-1.20.2-4.3.1-with-mclib.jar is geckolib-forge-1.20.2-4.3.1.jar with
    // mclib-20.jar's classes merged in (mclib's META-INF excluded, GeckoLib's kept). It has to
    // be a real file present before Gradle configures this project - Loom's ModConfigurationRemapper
    // checksums every modImplementation artifact during project configuration, before any task
    // (including one that could build this jar) has run - so it can't be produced by a Gradle
    // task; regenerate it by re-running the equivalent of:
    //   unzip geckolib-forge-1.20.2-4.3.1.jar -d tmp/ && unzip -o mclib-20.jar -d tmp/ -x "META-INF/*"
    //   (cd tmp && zip -r ../libs/geckolib-forge-1.20.2-4.3.1-with-mclib.jar .)
    // if bumping geckolib_version or mclib's "20".
    modImplementation files("libs/geckolib-forge-1.20.2-4.3.1-with-mclib.jar")

    // Optional/soft dependency, compile-only - see forge/compat/create/CreateWindmillCompat.java and
    // platform/forge/ExtraBiomesExpectPlatformImpl#applyWindmillCreateCompat. Never bundled or required
    // at runtime: gated behind a ModList.get().isLoaded("create") check, so the mod works fine without
    // Create installed. Version/classifier taken from Create's own "depend on Create" docs for 1.20.1 at
    // the time this was added - bump alongside terrablender_version-style pins if Create publishes a
    // newer 1.20.1 build and this stops resolving.
    // No 1.20.2 Create build available as of 2026-08-28 - re-enable when one ships.
    // modCompileOnly("com.simibubi.create:create-1.20.1:6.0.8-289:slim") { transitive = false }
    // Registrate - see root build.gradle's tterrag maven repo comment for why this is needed alongside
    // Create itself. compileOnly (not modCompileOnly): a plain library jar, not a mod, so it needs no
    // Loom remapping.
    // No 1.20.2 Registrate build available as of 2026-08-28 - re-enable when one ships.
    // compileOnly("com.tterrag.registrate:Registrate:MC1.20-1.3.3") { transitive = false }

    // TEMPORARY, local-only: lets the dev client actually load Create so its windmill-bearing compat can
    // be watched running for real. Never commit this block - Create must stay compileOnly-only for the
    // shipped mod (see the modCompileOnly entry above). Each of the 4 extra jars is one of Create's own
    // jar-in-jar bundled dependencies (META-INF/jarjar/*.jar inside create-1.20.1-6.0.8.jar) - Loom's dev
    // classpath doesn't auto-extract jar-in-jars (same issue as this module's GeckoLib/mclib jar above),
    // and dropping the raw unmapped jars straight into run/mods skips Loom's SRG->official remapping
    // entirely, crashing with NoSuchFieldError on Registrate's own vanilla field references. modRuntimeOnly
    // (not plain runtimeOnly) on each local file is what actually triggers that remapping.
    //
    // Disabled as of 2026-08-28: these are still the 1.20.1 Create jars (no 1.20.2 build exists, see the
    // modCompileOnly Create entry above), and loading 1.20.1 Create's mixins (e.g. create.mixins.json's
    // EntityMixin, which targets Entity#isCrouching(Pose) by 1.20.1 SRG/descriptor) against 1.20.2 vanilla
    // classes throws a hard MixinApplyError at launch - confirmed via `:forge:runData`. Re-enable once
    // Create ships a 1.20.2 build and the jars below are regenerated against it.
    // modRuntimeOnly files("libs/create-local-test/create-1.20.1-6.0.8.jar")
    // modRuntimeOnly files("libs/create-local-test/Registrate-MC1.20-1.3.3.jar")
    // modRuntimeOnly files("libs/create-local-test/Ponder-Forge-1.20.1-1.0.91.jar")
    // modRuntimeOnly files("libs/create-local-test/flywheel-forge-1.20.1-1.0.5.jar")
    // mixinextras-forge alone crashes with NoClassDefFoundError on MixinExtrasBootstrap - that class lives
    // in the separate mixinextras-common artifact, and FML's per-mod module system doesn't let
    // mixinextras-forge's module read a separately-declared mixinextras-common dependency's module (same
    // module-visibility problem as this module's GeckoLib/mclib jar above) - so, same fix: hand-merged into
    // one physical jar. Regenerate by re-running the merge in forge/libs/create-local-test/ if bumping the
    // Create pin changes its bundled mixinextras-forge version.
    // modRuntimeOnly files("libs/create-local-test/mixinextras-forge-0.4.1-with-common.jar")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", mod_id
    inputs.property "mod_name", mod_name
    inputs.property "mod_authors", mod_authors
    inputs.property "mod_description", mod_description
    inputs.property "forge_version_range", forge_version_range
    inputs.property "loader_version_range", loader_version_range

    filesMatching(['META-INF/mods.toml']) {
        expand([
                version              : project.version,
                mod_id               : mod_id,
                mod_name             : mod_name,
                mod_authors          : mod_authors,
                mod_description      : mod_description,
                forge_version_range  : forge_version_range,
                loader_version_range : loader_version_range,
        ])
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
    archiveFileName = "${archives_base_name}-forge-v${mod_version}-${minecraft_version}.jar"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}
