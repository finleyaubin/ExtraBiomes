
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license="MIT License"
[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    logoFile="extrabiomes_logo.png"
    authors="${mod_authors}"
    description='''${mod_description}'''
[[dependencies.extrabiomes]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.extrabiomes]]
    modId="terrablender"
    mandatory=true
    versionRange="[1.0.0.59,)"
    ordering="NONE"
    side="BOTH"
# Optional - see forge/compat/create/CreateWindmillCompat.java. Not required to play; only enables the
# windmill structure's Create Windmill Bearing swap when Create happens to also be installed.
[[dependencies.extrabiomes]]
    modId="create"
    mandatory=false
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"
