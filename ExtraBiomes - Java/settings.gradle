pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        // NeoForge - added ahead of the neoforge module itself (Milestone B), since this
        // block only ever needs touching once.
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

include("common")
include("forge")
include("fabric")
// neoforge module scaffold exists (see neoforge/) but is not yet includable - the pinned
// architectury-plugin/architectury-loom combination (3.4.164 / 1.11.458, kept for Gradle 8.14
// compatibility) fails to register the "neoForge" dependency configuration at all, even in the
// most minimal possible neoforge/build.gradle. See the note left in that directory / report to
// the user for details - this needs a decision before proceeding further.
// include("neoforge")

rootProject.name = "ExtraBiomes"
