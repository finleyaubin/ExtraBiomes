pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        // NeoForge - added ahead of the neoforge module itself (Milestone B), since this
        // block only ever needs touching once.
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

include("common")
// forge is out of scope for this release (Fabric + NeoForge only) - kept out of the build rather
// than deleted, so a future MC version branch can re-enable it by uncommenting this line.
// include("forge")
include("fabric")
include("neoforge")

rootProject.name = "ExtraBiomes"
