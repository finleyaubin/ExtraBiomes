# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=true


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
# Targeting 1.21.4 ("The Garden Awakens") per the project roadmap; see progress.json in the
# bump-mc-version skill.
minecraft_version=1.21.4
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
# Tightened to just 1.21.4 (see 1.20.2's note above for why a wide range is risky).
minecraft_version_range=[1.21.4,1.21.5)
# The Forge version must agree with the Minecraft version to get a valid artifact
# 54.1.14 is Forge's own "recommended" build for 1.21.4 (files.minecraftforge.net/.../promotions_slim.json).
# Note: this IS actually consumed even though enabled_platforms excludes forge - common/build.gradle
# has a compileOnly dependency on the raw net.minecraftforge:forge universal jar (for
# IForgeShearable, see common/build.gradle) that isn't gated by enabled_platforms. That's a plain
# Forge-maven artifact, unrelated to whether Architectury API (which forge/ needs) has a Forge
# build - Forge itself has published normally for every MC version, only Architectury API's Forge
# line stopped at 1.20.4 (11.1.17), which is why forge/ itself stays excluded (see
# enabled_platforms below).
forge_version=54.1.14
# The Forge version range can use any version of Forge as bounds or match the loader version range
# 54 follows the same floor-on-major-build-number convention as the prior 1.21.3 pin ([53,)) -
# files.minecraftforge.net doesn't publish an explicit "range" value, only build numbers.
forge_version_range=[54,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[54,)
# The mapping channel to use for mappings.
# The default set of supported mapping channels are ["official", "snapshot", "snapshot_nodoc", "stable", "stable_nodoc"].
# Additional mapping channels can be registered through the "channelProviders" extension in a Gradle plugin.
#
# | Channel   | Version              |                                                                                |
# |-----------|----------------------|--------------------------------------------------------------------------------|
# | official  | MCVersion            | Official field/method names from Mojang mapping files                          |
# | parchment | YYYY.MM.DD-MCVersion | Open community-sourced parameter names and javadocs layered on top of official |
#
# You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
# See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
#
# Parchment is an unofficial project maintained by ParchmentMC, separate from Minecraft Forge.
# Additional setup is needed to use their mappings, see https://parchmentmc.org/docs/getting-started
mapping_channel=official
# The mapping version to query from the mapping channel.
# This must match the format required by the mapping channel.
mapping_version=1.21.4


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=extrabiomes
# The human-readable display name for the mod.
mod_name=ExtraBiomes
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=3.10.0-beta-6
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.example.extrabiomes
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Win Epic Fin
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=ExtraBiomes adds 26 new biomes to the overworld, along with the mobs, blocks, and structures to fill them - from burnt forests and jellyfish-filled oceans to a floating Sky City above the mountains.
terrablender_version=4.3.0.2
# Modrinth file/version ID for the TerraBlender-forge upload matching terrablender_version above
# (https://modrinth.com/mod/terrablender/version/terrablender_version) - see common/build.gradle.
# Kept pinned even though Forge stays excluded from this build (see enabled_platforms below).
# NOTE: not re-verified for 1.21.4 since Forge is excluded and this id is unused - left as the
# stale pre-1.21.3 value it already was.
terrablender_modrinth_id=zCnl67h0
# geckolib_version is consumed by neoforge/build.gradle (there's no separate
# geckolib_neoforge_version property; forge stays excluded so its build isn't consumed here even
# though this value would apply). At 1.21.4, fabric and neoforge builds have converged back to a
# single version (4.8.5, unlike 1.21.3's fabric/neoforge split) - see geckolib_fabric_version below.
geckolib_version=4.8.5

## Multi-loader (Architectury) properties

# Platforms the common module targets. Forge is out of scope for this release too (Fabric +
# NeoForge only) - not removed from the repo, just excluded from this branch's build/CI/publish
# (see settings.gradle and .github/workflows/*.yml). Re-checked for 1.21.3: Architectury API's
# newest Forge build is still 11.1.17 for 1.20.4 (confirmed via api.modrinth.com/v2/project/
# architectury-api/version, scanning every version record for a forge loader tag) - no newer Forge
# build exists, so Forge stays out until Architectury resumes Forge publishing.
enabled_platforms=fabric,neoforge

archives_base_name=ExtraBiomes
maven_group=net.winepicfin.extrabiomes

# Pinned to the exact resolved build rather than a floating "-SNAPSHOT" channel - a floating
# tag resolves to whatever the newest snapshot happens to be at build time, which makes the
# build non-reproducible across machines/CI (each cache could pick up a different actual
# version).
#
# Bumped to the 1.17.x/3.5.x line (from 1.11.458/3.4.164) specifically to add NeoForge support
# (Milestone B) - the 1.11/3.4 line's architectury { neoForge() } + dependencies { neoForge
# "..." } fails at Gradle configuration time ("Could not find method neoForge() for arguments
# [...]") even in the most minimal possible neoforge/build.gradle, reproduced identically on
# both 1.11.458 and the latest 1.14.x patch (1.14.476) while keeping plugin 3.4.164 - a genuine
# gap in that plugin line's NeoForge bridging, not a config mistake or a loom-only version
# issue. This 1.17.x/3.5.x line needs a newer Gradle than the wrapper was previously pinned to
# (8.14) - see gradle/wrapper/gradle-wrapper.properties, now bumped to 9.7.1 alongside this.
# Re-confirmed unchanged for 1.21.3: 1.17.491/3.5.169 are still the newest published versions in
# their respective maven.architectury.dev repos (maven-metadata.xml), so this line already covers
# 1.21.3 - no Gradle major-version bump needed for this release.
architectury_loom_version=1.17.491
architectury_plugin_version=3.5.169
# Re-confirmed for 1.21.4: 1.17.491/3.5.169 are still the newest published loom/plugin versions
# (maven.architectury.dev maven-metadata.xml) - no Gradle major-version bump needed.
# 14.0.4 was 1.21.3's Architectury API line; 15.0.3 is the version published for 1.21.4 (Fabric +
# NeoForge, confirmed via api.modrinth.com/v2/project/architectury-api/version). Architectury never
# published an architectury-forge build past 11.1.17 (still true for 1.21.4) - see enabled_platforms
# above for why Forge stays excluded rather than mixing API versions across platforms.
architectury_api_version=15.0.3
fabric_loader_version=0.19.5
# Confirmed via maven.fabricmc.net - 0.19.5 is still the newest fabric-loader release (loader
# versions aren't per-Minecraft-version like fabric_api_version below).
fabric_api_version=0.119.4+1.21.4
# GeckoLib 1.21.4's fabric and neoforge builds have converged back to 4.8.5 (unlike 1.21.3's
# 4.7.3/4.7.1 split) - see geckolib_version above for the neoforge citation.
geckolib_fabric_version=4.8.5
# Modrinth file id for TerraBlender-fabric 4.3.0.2 for 1.21.4 (see terrablender_modrinth_id
# above for the -forge counterpart; kept on the same TerraBlender version across loaders).
terrablender_fabric_modrinth_id=BVtalJ0e
# Modrinth file id for TerraBlender-neoforge 4.3.0.2 for 1.21.4 (see terrablender_modrinth_id
# above for the -forge counterpart; kept on the same TerraBlender version across loaders).
terrablender_neoforge_modrinth_id=CmOWA4e9

## NeoForge properties (Milestone B - 1.20.2 was NeoForge's first supported Minecraft version)

# The NeoForge version must agree with the Minecraft version to get a valid artifact. Confirmed
# via maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge - 21.4.157 is the
# latest stable (non-beta) build of the 21.4.x line.
neoforge_version=21.4.157
# The NeoForge version range for mod-metadata dependency gating - matches the "neo_version_range"
# convention used by NeoForge's own MDK template (github.com/neoforged/MDK): major.minor only,
# not the full patch version.
neoforge_version_range=[21.4,)
# NeoForge's own small "FML loader" version (distinct from the neoforge_version above - this is
# the loader/API contract version, not the mod jar version). Fixed from a stale [1,) to [4,) per
# the neoforged/MDK 1.21.4 template's own loader_version_range pin (this was already [4,) at
# 1.21.3 in the MDK template too - our pin had drifted behind it for at least one MC version).
neoforge_loader_version_range=[4,)
